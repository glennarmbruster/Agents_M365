<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" role="img" aria-labelledby="th1 dh1">
  <title id="th1">Evolution from Scripted Bots to Copilot Agents (Pre-2022 to 2026)</title>
  <desc id="dh1">Four-stage timeline showing Era 1 Scripted Bots, Era 2 General AI Chat, Era 3 Declarative Agents and Agent Builder, and Era 4 Autonomous Multi-Agent Workflows.</desc>
  <rect x="2" y="2" width="756" height="221" rx="12" fill="#faf6ea" stroke="#c1bcab" stroke-width="2"/>
  <text x="24" y="34" fill="#145756" font-family="Georgia,serif" font-size="20">How Workplace Assistants Evolved Into Copilot Agents</text>
  <line x1="40" y1="62" x2="720" y2="62" stroke="#8b571b" stroke-width="3"/>
  <circle cx="105" cy="62" r="8" fill="#8b571b"/>
  <rect x="24" y="78" width="162" height="128" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="1.8"/>
  <text x="36" y="100" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">ERA 1 · PRE-2022</text>
  <text x="36" y="120" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Scripted Chatbots</text>
  <text x="36" y="140" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">• Rigid decision trees</text>
  <text x="36" y="157" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">• Broke on typos</text>
  <text x="36" y="174" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">• Power Virtual Agents</text>
  <text x="36" y="190" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">  launched late 2019</text>

  <circle cx="285" cy="62" r="8" fill="#8b571b"/>
  <rect x="204" y="78" width="162" height="128" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="1.8"/>
  <text x="216" y="100" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">ERA 2 · 2022–2023</text>
  <text x="216" y="120" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="700">General AI Chat</text>
  <text x="216" y="140" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">• Natural language</text>
  <text x="216" y="157" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">• M365 Copilot launch</text>
  <text x="216" y="174" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">• Blank slate every</text>
  <text x="216" y="190" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">  single morning</text>

  <circle cx="465" cy="62" r="8" fill="#145756"/>
  <rect x="384" y="78" width="162" height="128" rx="8" fill="#edf1e7" stroke="#145756" stroke-width="2"/>
  <text x="396" y="100" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">ERA 3 · 2024</text>
  <text x="396" y="120" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Declarative Agents</text>
  <text x="396" y="140" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11.5">• Agent Builder debuts</text>
  <text x="396" y="157" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11.5">• Saved rules + files</text>
  <text x="396" y="174" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11.5">• SharePoint grounding</text>
  <text x="396" y="190" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11.5">  with Rule citations</text>

  <circle cx="645" cy="62" r="8" fill="#145756"/>
  <rect x="564" y="78" width="172" height="128" rx="8" fill="#145756"/>
  <text x="576" y="100" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="11" font-weight="700">ERA 4 · 2025–2026</text>
  <text x="576" y="120" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Autonomous Teams</text>
  <text x="576" y="140" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="11.5">• Event triggers &amp; flows</text>
  <text x="576" y="157" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="11.5">• Multi-agent routers</text>
  <text x="576" y="174" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="11.5">• Copilot Credit meters</text>
  <text x="576" y="190" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="11.5">  &amp; human sign-off</text>
</svg>