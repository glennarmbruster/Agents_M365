<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="t7 d7">
      <title id="t7">Preview Before Writing Permit &amp; Dispatch Records</title>
      <desc id="d7">Four-step confirmation flow.</desc>
      <rect x="2" y="2" width="756" height="196" rx="12" fill="#faf6ea" stroke="#c1bcab" stroke-width="2"/>
      <text x="24" y="34" fill="#145756" font-family="Georgia,serif" font-size="20">The Safety Rule for Action Agents: Preview Before Writing</text>
      <rect x="24" y="56" width="160" height="118" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
      <text x="104" y="82" text-anchor="middle" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">STEP 1 · COLLECT</text>
      <text x="104" y="106" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Ask Event Details</text>
      <text x="104" y="128" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12">Dept, date, guests,</text>
      <text x="104" y="146" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12">lot &amp; charter buses</text>
      <path d="M188 115 H206" stroke="#8b571b" stroke-width="3"/>
      <rect x="210" y="56" width="160" height="118" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
      <text x="290" y="82" text-anchor="middle" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">STEP 2 · PREVIEW</text>
      <text x="290" y="106" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Show Summary Card</text>
      <text x="290" y="128" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12">Display cost ($8/pass)</text>
      <text x="290" y="146" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12">&amp; overflow rules</text>
      <path d="M374 115 H392" stroke="#8b571b" stroke-width="3"/>
      <rect x="396" y="56" width="160" height="118" rx="8" fill="#edf1e7" stroke="#8b571b" stroke-width="2.5"/>
      <text x="476" y="82" text-anchor="middle" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">STEP 3 · CONFIRM</text>
      <text x="476" y="106" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Staff Clicks Yes</text>
      <text x="476" y="128" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="12">Coordinator checks</text>
      <text x="476" y="146" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="12">lot &amp; clicks Confirm</text>
      <path d="M560 115 H578" stroke="#8b571b" stroke-width="3"/>
      <rect x="582" y="56" width="154" height="118" rx="8" fill="#145756"/>
      <text x="659" y="82" text-anchor="middle" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="11" font-weight="700">STEP 4 · LOG</text>
      <text x="659" y="106" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Write Tracker Row</text>
      <text x="659" y="128" text-anchor="middle" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="12">Add to Excel table</text>
      <text x="659" y="146" text-anchor="middle" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="12">&amp; return receipt ID</text>
    </svg>