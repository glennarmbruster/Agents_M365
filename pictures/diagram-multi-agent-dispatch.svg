<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="t12 d12">
      <title id="t12">Multi-Agent Parking &amp; Transit Dispatch Hub</title>
      <desc id="d12">Front Desk Router coordinating Policy Rulebook Agent, Fleet &amp; Shuttle Maintenance Agent, and Event Permit Intake Agent.</desc>
      <rect x="2" y="2" width="756" height="226" rx="12" fill="#faf6ea" stroke="#c1bcab" stroke-width="2"/>
      <text x="24" y="34" fill="#145756" font-family="Georgia,serif" font-size="20">Level 5 Capstone: One Front-Desk Router + Three Specialist Agents</text>

      <rect x="230" y="48" width="300" height="54" rx="8" fill="#145756"/>
      <text x="380" y="72" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Parking &amp; Transit Front-Desk Router</text>
      <text x="380" y="90" text-anchor="middle" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="11.5">Splits questions &amp; combines verified replies</text>

      <path d="M290 102 L140 130" stroke="#8b571b" stroke-width="2.5"/>
      <path d="M380 102 L380 130" stroke="#8b571b" stroke-width="2.5"/>
      <path d="M470 102 L620 130" stroke="#8b571b" stroke-width="2.5"/>

      <rect x="24" y="132" width="224" height="78" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
      <text x="136" y="156" text-anchor="middle" fill="#145756" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Specialist 1: Rulebook &amp; Appeals</text>
      <text x="136" y="176" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">Permits, shuttles, 14-day appeals</text>
      <text x="136" y="194" text-anchor="middle" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Reads Parking-Transit-Handbook</text>

      <rect x="268" y="132" width="224" height="78" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
      <text x="380" y="156" text-anchor="middle" fill="#145756" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Specialist 2: Fleet &amp; Gate Log</text>
      <text x="380" y="176" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">Open tickets, ADA lifts, repeat faults</text>
      <text x="380" y="194" text-anchor="middle" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Reads Fleet-Maintenance-Log</text>

      <rect x="512" y="132" width="224" height="78" rx="8" fill="#edf1e7" stroke="#8b571b" stroke-width="2"/>
      <text x="624" y="156" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Specialist 3: Event &amp; Bus Intake</text>
      <text x="624" y="176" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11.5">Lot D overflow, bus apron, Excel log</text>
      <text x="624" y="194" text-anchor="middle" fill="#145756" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Confirmation Card + Action</text>
    </svg>