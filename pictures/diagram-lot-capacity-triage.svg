<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="t9e d9e">
      <title id="t9e">Power Platform DLP Connector Classification Matrix</title>
      <desc id="d9e">Business vs Non-Business vs Blocked connector groups in Copilot Studio.</desc>
      <rect x="2" y="2" width="756" height="216" rx="12" fill="#faf6ea" stroke="#c1bcab" stroke-width="2"/>
      <text x="24" y="34" fill="#145756" font-family="Georgia,serif" font-size="20">Power Platform DLP Boundaries for Copilot Studio Agents (Rule GOV-04)</text>
      <rect x="24" y="54" width="224" height="142" rx="8" fill="#edf1e7" stroke="#145756" stroke-width="2"/>
      <text x="38" y="80" fill="#145756" font-family="system-ui,sans-serif" font-size="12" font-weight="700">BUSINESS GROUP (ALLOWED)</text>
      <text x="38" y="106" fill="#182c2d" font-family="system-ui,sans-serif" font-size="12.5">• SharePoint &amp; OneDrive</text>
      <text x="38" y="128" fill="#182c2d" font-family="system-ui,sans-serif" font-size="12.5">• Excel Online (Business)</text>
      <text x="38" y="150" fill="#182c2d" font-family="system-ui,sans-serif" font-size="12.5">• Microsoft Teams &amp; Planner</text>
      <text x="38" y="176" fill="#145756" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700">Safe to combine in 1 agent</text>

      <rect x="268" y="54" width="224" height="142" rx="8" fill="#fffdf6" stroke="#8b571b" stroke-width="2"/>
      <text x="282" y="80" fill="#8b571b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">NON-BUSINESS (ISOLATED)</text>
      <text x="282" y="106" fill="#182c2d" font-family="system-ui,sans-serif" font-size="12.5">• External SaaS connectors</text>
      <text x="282" y="128" fill="#182c2d" font-family="system-ui,sans-serif" font-size="12.5">• Unverified third-party APIs</text>
      <text x="282" y="154" fill="#8b571b" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Mixing with Business triggers</text>
      <text x="282" y="172" fill="#8b571b" font-family="system-ui,sans-serif" font-size="12" font-weight="600">automatic DLP quarantine</text>

      <rect x="512" y="54" width="224" height="142" rx="8" fill="#182c2d"/>
      <text x="526" y="80" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="12" font-weight="700">BLOCKED GROUP</text>
      <text x="526" y="106" fill="#ffffff" font-family="system-ui,sans-serif" font-size="12.5">• Consumer social/mail</text>
      <text x="526" y="128" fill="#ffffff" font-family="system-ui,sans-serif" font-size="12.5">• Unauthenticated HTTP</text>
      <text x="526" y="156" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="12">Blocked at tenant runtime</text>
      <text x="526" y="176" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="11.5">Enforced by Power Platform</text>
    </svg>